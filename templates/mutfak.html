<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png" />
  <meta name="apple-mobile-web-app-title" content="Mutfak" />
  <title>Mutfak Ekranı — Çiftlik Restoran</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d1117;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #161b22;
      border-bottom: 3px solid #0d8a80;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .header-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #3dd9ce;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .header-sub { font-size: 0.75rem; color: #888; letter-spacing: 3px; text-transform: uppercase; }

    #clock {
      font-size: 1.8rem;
      font-weight: 700;
      color: #3dd9ce;
      font-variant-numeric: tabular-nums;
    }

    #status-bar {
      background: #161b22;
      padding: 8px 24px;
      font-size: 0.8rem;
      color: #666;
      border-bottom: 1px solid #21262d;
    }

    .orders-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      padding: 24px;
      align-content: start;
    }

    .order-card {
      background: #161b22;
      border-radius: 16px;
      border-left: 6px solid #4caf50;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      transition: border-color 0.3s;
    }

    .order-card.warn   { border-left-color: #ff9800; }
    .order-card.urgent { border-left-color: #f44336; }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px 12px;
      border-bottom: 1px solid #21262d;
    }

    .table-name {
      font-size: 1.5rem;
      font-weight: 800;
      color: #fff;
      text-transform: uppercase;
    }

    .time-badge {
      font-size: 0.9rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 20px;
      background: #21262d;
      color: #4caf50;
    }

    .order-card.warn   .time-badge { color: #ff9800; }
    .order-card.urgent .time-badge { color: #f44336; }

    .card-meta {
      padding: 6px 20px 10px;
      font-size: 0.8rem;
      color: #888;
    }

    .items-list {
      padding: 12px 20px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .item-qty {
      font-size: 1.6rem;
      font-weight: 900;
      color: #3dd9ce;
      min-width: 36px;
      text-align: center;
      line-height: 1;
    }

    .item-name {
      font-size: 1.2rem;
      font-weight: 600;
      color: #fff;
      line-height: 1.3;
    }

    .card-notes {
      margin: 0 20px 16px;
      padding: 8px 14px;
      background: #1c2230;
      border-left: 3px solid #ff9800;
      border-radius: 0 8px 8px 0;
      font-size: 0.9rem;
      color: #ffcc80;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      color: #444;
    }
    .empty-icon { font-size: 5rem; margin-bottom: 16px; }
    .empty-text { font-size: 1.4rem; font-weight: 600; }
  </style>
</head>
<body>

<header>
  <div>
    <div class="header-sub">Sapanca Çiftlik Restoran</div>
    <div class="header-title">🍽 Mutfak Ekranı</div>
  </div>
  <div id="clock"></div>
</header>

<div id="status-bar">Bağlanıyor...</div>

<div class="orders-grid" id="orders-grid">
  <div class="empty-state">
    <div class="empty-icon">🍽</div>
    <div class="empty-text">Bekleyen sipariş yok</div>
  </div>
</div>

<script>
function updateClock() {
  const now = new Date();
  document.getElementById("clock").textContent =
    now.toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}
updateClock();
setInterval(updateClock, 1000);

function minutesSince(isoStr) {
  const then = new Date(isoStr.replace(" ", "T"));
  return Math.floor((Date.now() - then.getTime()) / 60000);
}

function urgencyClass(mins) {
  if (mins >= 20) return "urgent";
  if (mins >= 10) return "warn";
  return "";
}

function timeLabel(mins) {
  if (mins < 1)  return "az önce";
  if (mins === 1) return "1 dk";
  return `${mins} dk`;
}

async function loadOrders() {
  try {
    const res    = await fetch("/api/kitchen/orders?station=mutfak");
    const orders = await res.json();
    const grid   = document.getElementById("orders-grid");
    const bar    = document.getElementById("status-bar");

    bar.textContent = `Son güncelleme: ${new Date().toLocaleTimeString("tr-TR")} — ${orders.length} sipariş`;

    if (!orders.length) {
      grid.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🍽</div>
          <div class="empty-text">Bekleyen sipariş yok</div>
        </div>`;
      return;
    }

    grid.innerHTML = orders.map(o => {
      const mins  = minutesSince(o.created_at);
      const cls   = urgencyClass(mins);
      const tLbl  = timeLabel(mins);

      const itemsHtml = o.items.map(i => `
        <div class="item-row">
          <div class="item-qty">${i.quantity}</div>
          <div class="item-name">${esc(i.name)}</div>
        </div>`).join("");

      const notesHtml = o.notes
        ? `<div class="card-notes">📝 ${esc(o.notes)}</div>` : "";

      return `
        <div class="order-card ${cls}">
          <div class="card-header">
            <div class="table-name">${esc(o.table_number)}</div>
            <div class="time-badge">${tLbl}</div>
          </div>
          <div class="card-meta">${esc(o.waiter || "—")}</div>
          <div class="items-list">${itemsHtml}</div>
          ${notesHtml}
        </div>`;
    }).join("");

  } catch (e) {
    document.getElementById("status-bar").textContent = "⚠ Bağlantı hatası — yeniden deneniyor...";
  }
}

function esc(s) {
  return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

loadOrders();
setInterval(loadOrders, 5000);
</script>
</body>
</html>
