<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#F8F3E6" />
  <title>Adisyon — Çiftlik Restoran</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    .hidden { display: none !important; }

    /* Renkler web sitesinin paletinden; görünüm Apple tarzı buzlu cam */
    :root {
      --cream:      #F8F3E6;
      --paper:      #FCFAF1;
      --olive:      #1E3B26;
      --olive-light:#5C8A4A;
      --gold:       #D9A441;
      --gold-dark:  #B9852E;
      --ink:        #211C12;
      --ink-2:      #4A4132;
      --ink-3:      #6B6250;
      --line:       rgba(33, 28, 18, 0.09);
      --line-2:     rgba(33, 28, 18, 0.14);
      --accent:     #2F6B3F;
      --accent-hov: #265834;
      --accent-soft:rgba(92, 138, 74, 0.14);
      --danger:     #B4432F;
      --glass:        rgba(252, 250, 241, 0.62);
      --glass-strong: rgba(252, 250, 241, 0.86);
      --glass-edge:   rgba(255, 255, 255, 0.65);
      --blur:         saturate(170%) blur(22px);
    }

    html { background: var(--cream); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      background: transparent;  /* zemin html'de; body::before fotoğrafı görünsün */
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      font-variant-numeric: tabular-nums;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      /* Web sitesindeki restoran fotoğrafı, önceden bulanıklaştırılmış (static/bg-blur.jpg) */
      background:
        linear-gradient(rgba(248, 243, 230, 0.68), rgba(248, 243, 230, 0.68)),
        url("/static/bg-blur.jpg") center 62% / cover no-repeat;
      pointer-events: none;
    }
    button, input, select { font-family: inherit; }

    /* ── HEADER ── */
    header {
      background: var(--glass-strong);
      -webkit-backdrop-filter: var(--blur);
      backdrop-filter: var(--blur);
      border-bottom: 1px solid var(--line);
      padding: calc(10px + env(safe-area-inset-top, 0px)) 18px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-title { font-size: 1.05rem; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; }
    .header-sub   { font-size: 0.66rem; color: var(--ink-2); letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; display: block; }

    .garson-select-wrap { display: flex; align-items: center; gap: 8px; }
    .garson-label { font-size: 0.8rem; color: var(--ink-2); }

    #garson-select {
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid var(--line-2);
      color: var(--ink);
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* ── MAIN LAYOUT ── */
    .layout {
      display: flex;
      flex: 1;
      height: calc(100vh - 58px);
      min-height: 0;
    }

    /* ── MENÜ PANELİ ── */
    .menu-panel {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .search-bar { padding: 14px 16px 6px; }

    .search-bar input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--line-2);
      border-radius: 11px;
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.72);
      color: var(--ink);
      transition: background 0.15s, box-shadow 0.15s;
    }
    .search-bar input::placeholder { color: var(--ink-3); }
    .search-bar input:focus { outline: none; background: #fff; border-color: var(--gold); box-shadow: 0 0 0 4px rgba(217, 164, 65, 0.2); }

    .category-tabs {
      display: flex;
      gap: 6px;
      padding: 8px 16px 10px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .category-tabs::-webkit-scrollbar { display: none; }

    .cat-btn {
      padding: 7px 15px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.55);
      -webkit-backdrop-filter: var(--blur);
      backdrop-filter: var(--blur);
      color: var(--ink-2);
      font-size: 0.86rem;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    .cat-btn:hover { background: rgba(255, 255, 255, 0.9); color: var(--ink); }
    .cat-btn.active { background: var(--olive); color: var(--cream); border-color: transparent; }

    .menu-items {
      flex: 1;
      overflow-y: auto;
      padding: 6px 16px 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
      align-content: start;
    }

    .menu-item-card {
      background: rgba(252, 250, 241, 0.72);
      border-radius: 14px;
      padding: 14px 12px;
      text-align: left;
      cursor: pointer;
      border: 1px solid var(--glass-edge);
      box-shadow: 0 1px 0 rgba(255,255,255,0.7) inset, 0 6px 18px rgba(33, 28, 18, 0.05);
      transition: transform 0.12s, box-shadow 0.15s, background 0.15s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      display: flex;
      flex-direction: column;
    }
    .menu-item-card:hover  { background: rgba(255, 255, 255, 0.92); box-shadow: 0 10px 24px rgba(33, 28, 18, 0.08); }
    .menu-item-card:active { transform: scale(0.97); }
    .menu-item-card.in-cart { background: #fff; border-color: rgba(47, 107, 63, 0.45); box-shadow: 0 0 0 1px rgba(47, 107, 63, 0.35), 0 8px 20px rgba(47, 107, 63, 0.10); }

    .menu-item-cat   { font-size: 0.68rem; color: var(--ink-2); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
    .menu-item-name  { font-size: 0.92rem; font-weight: 600; color: var(--ink); line-height: 1.3; margin-bottom: 8px; flex: 1; }
    .menu-item-price { font-size: 0.95rem; font-weight: 600; color: var(--ink-2); }

    .menu-item-qty-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      align-self: flex-start;
      background: var(--accent);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      min-width: 22px; height: 22px;
      padding: 0 6px;
      border-radius: 11px;
      margin-top: 8px;
    }

    /* ── SİPARİŞ PANELİ ── */
    .order-panel {
      width: 330px;
      display: flex;
      flex-direction: column;
      background: var(--glass);
      -webkit-backdrop-filter: var(--blur);
      backdrop-filter: var(--blur);
      border-left: 1px solid var(--line);
      flex-shrink: 0;
    }

    .order-panel-header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--line);
    }

    .order-meta { display: flex; gap: 10px; margin-bottom: 8px; }

    .order-meta select,
    .order-meta input,
    .order-notes-input,
    .bungalov-row select {
      flex: 1;
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line-2);
      border-radius: 10px;
      font-size: 0.9rem;
      background: rgba(255, 255, 255, 0.8);
      color: var(--ink);
    }
    .order-meta select { font-weight: 600; text-transform: capitalize; }
    .order-notes-input { font-size: 0.86rem; }
    .order-meta select:focus, .order-meta input:focus,
    .order-notes-input:focus, .bungalov-row select:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 4px rgba(217, 164, 65, 0.2); }

    .order-items-list { flex: 1; overflow-y: auto; padding: 6px 16px; }

    .cart-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 11px 0;
      border-bottom: 1px solid var(--line);
    }
    .cart-item:last-child { border-bottom: none; }

    .cart-item-name { flex: 1; font-size: 0.88rem; font-weight: 500; color: var(--ink); }
    .cart-item-subtotal { font-size: 0.86rem; font-weight: 600; color: var(--ink); min-width: 62px; text-align: right; }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 2px;
      background: rgba(33, 28, 18, 0.06);
      border-radius: 9px;
      padding: 2px;
    }

    .qty-btn {
      width: 30px; height: 30px;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: var(--ink);
      font-size: 1.1rem;
      font-weight: 500;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.12s;
      flex-shrink: 0;
    }
    .qty-btn:hover  { background: #fff; box-shadow: 0 1px 3px rgba(33, 28, 18, 0.12); }
    .qty-btn:active { transform: scale(0.92); }
    .qty-num { width: 24px; text-align: center; font-size: 0.9rem; font-weight: 600; }

    .order-empty {
      text-align: center;
      padding: 48px 20px;
      color: var(--ink-3);
      font-size: 0.9rem;
    }
    .order-empty-icon { margin-bottom: 10px; opacity: 0.45; display: flex; justify-content: center; }
    .order-empty-icon svg { width: 40px; height: 40px; }

    .order-footer {
      padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
      border-top: 1px solid var(--line);
    }

    .order-total-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
    }
    .order-total-label { font-size: 0.86rem; color: var(--ink-2); font-weight: 500; }
    .order-total-amount { font-size: 1.6rem; font-weight: 700; color: var(--ink); letter-spacing: -0.02em; }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 13px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      box-shadow: 0 6px 16px rgba(47, 107, 63, 0.28);
    }
    .submit-btn:hover  { filter: brightness(0.94); }
    .submit-btn:active { transform: scale(0.98); }
    .submit-btn:disabled { background: rgba(33, 28, 18, 0.14) !important; color: var(--ink-3); box-shadow: none; cursor: not-allowed; }

    .clear-btn {
      width: 100%;
      padding: 10px;
      background: transparent;
      color: var(--danger);
      border: none;
      border-radius: 11px;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.15s;
    }
    .clear-btn:hover { background: rgba(180, 67, 47, 0.08); }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: calc(24px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%) translateY(120px);
      background: rgba(33, 28, 18, 0.86);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      color: #fff;
      padding: 12px 24px;
      border-radius: 14px;
      font-size: 0.95rem;
      font-weight: 500;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s cubic-bezier(.2,.8,.2,1);
      z-index: 999;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.error { background: rgba(180, 67, 47, 0.92); }

    /* ── AKTİF SİPARİŞ BANNER ── */
    .active-order-banner {
      background: rgba(217, 164, 65, 0.16);
      border: 1px solid rgba(217, 164, 65, 0.35);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    .active-order-info { font-size: 0.8rem; color: #7A5418; font-weight: 600; margin-bottom: 8px; }
    .active-order-actions { display: flex; gap: 4px; background: rgba(255, 255, 255, 0.5); border-radius: 9px; padding: 2px; }
    .aob-btn {
      flex: 1; padding: 7px 6px; border-radius: 7px; border: none;
      font-size: 0.8rem; font-weight: 500; cursor: pointer; background: transparent;
      color: var(--ink-2); transition: background 0.15s, color 0.15s;
    }
    .aob-btn:hover { color: var(--ink); }
    .aob-btn.selected { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(33, 28, 18, 0.12); }
    .mode-badge { text-align: center; font-size: 0.76rem; color: var(--gold-dark); font-weight: 600; margin-top: 6px; }

    /* ── BUNGALOV ROW ── */
    .bungalov-row { display: none; margin-top: 8px; }

    /* ── SEPET ÇUBUĞU (yalnızca telefonda) ── */
    .cart-bar, .sheet-head, .sheet-backdrop { display: none; }

    @media (max-width: 700px) {
      .header-sub { display: none; }
      .layout { height: auto; flex: 1; }
      .menu-panel { overflow: visible; }
      .menu-items {
        overflow: visible;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        padding: 6px 12px calc(96px + env(safe-area-inset-bottom, 0px));
      }
      .search-bar { padding: 12px 12px 4px; }
      .category-tabs { padding: 8px 12px 10px; }
      .menu-item-card { padding: 12px 11px; min-height: 96px; }

      /* iOS'ta odaklanınca sayfanın yakınlaşmaması için 16px */
      .search-bar input, .order-meta select, .order-notes-input, .bungalov-row select, #garson-select { font-size: 16px; }

      /* Sipariş paneli alttan açılan sayfa */
      .order-panel {
        position: fixed; left: 0; right: 0; bottom: 0;
        width: auto; max-height: 88dvh;
        z-index: 50;
        background: var(--glass-strong);
        border-left: none;
        border-radius: 20px 20px 0 0;
        box-shadow: 0 -12px 40px rgba(33, 28, 18, 0.18);
        transform: translateY(105%);
        transition: transform 0.28s cubic-bezier(.2,.8,.2,1);
      }
      body.sheet-open .order-panel { transform: translateY(0); }
      body.sheet-open { overflow: hidden; }

      .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px 0; }
      .sheet-title { font-size: 1rem; font-weight: 700; }
      .sheet-close {
        width: 34px; height: 34px; border-radius: 50%; border: none;
        background: rgba(33, 28, 18, 0.07); color: var(--ink-2);
        font-size: 1.1rem; cursor: pointer;
      }
      .sheet-backdrop {
        position: fixed; inset: 0; z-index: 40;
        background: rgba(33, 28, 18, 0.32);
      }
      body.sheet-open .sheet-backdrop { display: block; }

      .cart-bar {
        display: flex; align-items: center; gap: 12px;
        position: fixed; left: 12px; right: 12px;
        bottom: calc(12px + env(safe-area-inset-bottom, 0px));
        z-index: 30;
        padding: 12px 14px 12px 16px;
        border: none; border-radius: 16px;
        background: var(--olive); color: var(--cream);
        box-shadow: 0 10px 28px rgba(30, 59, 38, 0.35);
        font-size: 0.95rem; cursor: pointer; text-align: left;
      }
      .cart-bar-count {
        min-width: 26px; height: 26px; padding: 0 7px; border-radius: 13px;
        background: rgba(248, 243, 230, 0.18);
        display: inline-flex; align-items: center; justify-content: center;
        font-weight: 700; font-size: 0.85rem;
      }
      .cart-bar-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .cart-bar-table { opacity: 0.75; font-size: 0.82rem; }
      .cart-bar-total { font-weight: 700; font-size: 1.05rem; }
      .cart-bar.empty { background: rgba(33, 28, 18, 0.55); box-shadow: none; }

      .toast { white-space: normal; max-width: calc(100vw - 32px); text-align: center; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
    }

    @media (max-width: 360px) {
      .garson-label { display: none; }
    }

    /* ── PIN EKRANI ── */
    #pin-screen {
      position: fixed; inset: 0; z-index: 1000;
      background:
        linear-gradient(rgba(248, 243, 230, 0.6), rgba(248, 243, 230, 0.6)),
        url("/static/bg-blur.jpg") center 62% / cover no-repeat var(--cream);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 26px;
      padding: 24px 16px;
    }
    #pin-screen.hidden { display: none; }

    .pin-logo { font-size: 0.72rem; color: var(--ink-2); letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600; }
    .pin-title { font-size: 1.6rem; font-weight: 700; color: var(--ink); letter-spacing: -0.02em; text-align: center; }

    .waiter-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 10px; width: 290px;
    }
    .waiter-btn {
      padding: 18px 16px; border-radius: 16px;
      border: 1px solid var(--glass-edge);
      background: var(--glass);
      -webkit-backdrop-filter: var(--blur);
      backdrop-filter: var(--blur);
      box-shadow: 0 1px 0 rgba(255,255,255,0.7) inset, 0 8px 22px rgba(33, 28, 18, 0.07);
      color: var(--ink);
      font-size: 1rem; font-weight: 600; cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .waiter-btn:hover { background: rgba(255, 255, 255, 0.9); }
    .waiter-btn:active { transform: scale(0.97); }
    .waiter-btn.selected { background: var(--olive); color: var(--cream); }

    .pin-pad-wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .pin-dots { display: flex; gap: 16px; margin-bottom: 4px; }
    .pin-dot {
      width: 14px; height: 14px; border-radius: 50%;
      border: 1.5px solid var(--ink-3); background: transparent;
      transition: background 0.15s, border-color 0.15s;
    }
    .pin-dot.filled { background: var(--ink); border-color: var(--ink); }

    .pin-grid { display: grid; grid-template-columns: repeat(3, 78px); gap: 14px; }
    .pin-key {
      height: 78px; border-radius: 50%;
      border: 1px solid var(--glass-edge);
      background: var(--glass);
      -webkit-backdrop-filter: var(--blur);
      backdrop-filter: var(--blur);
      box-shadow: 0 1px 0 rgba(255,255,255,0.7) inset, 0 6px 16px rgba(33, 28, 18, 0.06);
      color: var(--ink);
      font-size: 1.6rem; font-weight: 400; cursor: pointer;
      transition: background 0.12s, transform 0.1s;
      display: flex; align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .pin-key:hover  { background: rgba(255, 255, 255, 0.9); }
    .pin-key:active { transform: scale(0.93); background: rgba(33, 28, 18, 0.10); }
    .pin-key.del    { font-size: 1.1rem; color: var(--ink-2); background: transparent; border-color: transparent; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
    .pin-key.empty  { border: none; background: transparent; box-shadow: none; cursor: default; pointer-events: none; -webkit-backdrop-filter: none; backdrop-filter: none; }

    .pin-error { color: var(--danger); font-size: 0.86rem; font-weight: 600; height: 20px; }
    .pin-back  { color: var(--ink-2); font-size: 0.86rem; cursor: pointer; margin-top: 4px; }
    .pin-back:hover { color: var(--ink); }
  </style>
</head>
<body>

<!-- PIN Ekranı -->
<div id="pin-screen">
  <div class="pin-logo">Sapanca Çiftlik Restoran</div>

  <!-- Adım 1: Garson seçimi -->
  <div id="pin-step-select" style="display:flex;flex-direction:column;align-items:center;gap:20px">
    <div class="pin-title">Merhaba, kim giriş yapıyor?</div>
    <div class="waiter-grid" id="waiter-btn-grid"></div>
  </div>

  <!-- Adım 2: PIN girişi -->
  <div id="pin-step-pad" style="display:none;flex-direction:column;align-items:center;gap:20px">
    <div class="pin-title" id="pin-greeting"></div>
    <div class="pin-pad-wrap">
      <div class="pin-dots">
        <div class="pin-dot" id="d0"></div>
        <div class="pin-dot" id="d1"></div>
        <div class="pin-dot" id="d2"></div>
        <div class="pin-dot" id="d3"></div>
      </div>
      <div class="pin-error" id="pin-error"></div>
      <div class="pin-grid">
        <button class="pin-key" onclick="pinKey('1')">1</button>
        <button class="pin-key" onclick="pinKey('2')">2</button>
        <button class="pin-key" onclick="pinKey('3')">3</button>
        <button class="pin-key" onclick="pinKey('4')">4</button>
        <button class="pin-key" onclick="pinKey('5')">5</button>
        <button class="pin-key" onclick="pinKey('6')">6</button>
        <button class="pin-key" onclick="pinKey('7')">7</button>
        <button class="pin-key" onclick="pinKey('8')">8</button>
        <button class="pin-key" onclick="pinKey('9')">9</button>
        <button class="pin-key empty"></button>
        <button class="pin-key" onclick="pinKey('0')">0</button>
        <button class="pin-key del" onclick="pinDel()">⌫</button>
      </div>
    </div>
    <span class="pin-back" onclick="pinBack()">← Geri dön</span>
  </div>
</div>

<header>
  <div>
    <span class="header-sub">Sapanca Çiftlik</span>
    <div class="header-title">Adisyon</div>
  </div>
  <div class="garson-select-wrap">
    <span class="garson-label">Garson:</span>
    <select id="garson-select">
      <option value="">Seç</option>
      <option>Sami</option>
      <option>Rahman</option>
      <option>Engin</option>
      <option>Bedirhan</option>
      <option>Sait</option>
    </select>
  </div>
</header>

<div class="layout">

  <!-- Menü Paneli -->
  <div class="menu-panel">
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Ürün ara..." oninput="filterItems()" />
    </div>
    <div class="category-tabs" id="category-tabs"></div>
    <div class="menu-items" id="menu-items"></div>
  </div>

  <!-- Sipariş Paneli -->
  <div class="order-panel" id="order-panel">
    <div class="sheet-head">
      <span class="sheet-title">Sipariş</span>
      <button class="sheet-close" onclick="closeSheet()" aria-label="Kapat">✕</button>
    </div>
    <div class="order-panel-header">
      <div id="active-order-banner" class="active-order-banner hidden">
        <div class="active-order-info">
          <span id="active-order-label">Bu masada açık sipariş var</span>
        </div>
        <div class="active-order-actions">
          <button class="aob-btn aob-add" onclick="setModeAdd()">+ Ekle</button>
          <button class="aob-btn aob-new" onclick="setModeNew()">Yeni</button>
          <button class="aob-btn aob-receipt" onclick="openAdisyon()">Adisyon</button>
        </div>
      </div>

      <div class="order-meta">
        <select id="table-select" onchange="checkActiveOrder(); updateCartBar()">
          <option value="">Masa Seç</option>
          <optgroup label="Sağ">
            <option>sağ 1</option><option>sağ 2</option><option>sağ 3</option>
            <option>sağ 4</option><option>sağ 5</option><option>sağ 6</option><option>sağ 7</option>
          </optgroup>
          <optgroup label="Orta">
            <option>orta 1</option><option>orta 2</option><option>orta 3</option>
            <option>orta 4</option><option>orta 5</option><option>orta 6</option>
          </optgroup>
          <optgroup label="Sol">
            <option>sol 1</option><option>sol 2</option><option>sol 3</option>
            <option>sol 4</option><option>sol 5</option><option>sol 6</option>
          </optgroup>
          <optgroup label="Salon">
            <option>salon 1</option><option>salon 2</option><option>salon 3</option><option>salon 4</option>
            <option>salon 5</option><option>salon 6</option><option>salon 7</option><option>salon 8</option>
          </optgroup>
          <optgroup label="Loca">
            <option value="geyikli loca">Geyikli Loca</option>
          </optgroup>
        </select>
      </div>
      <input type="text" class="order-notes-input" id="notes-input" placeholder="Not (opsiyonel)..." />
      <div class="bungalov-row" id="bungalov-row">
        <select id="bungalov-select">
          <option value="">Bungalov hesabına ekleme</option>
        </select>
      </div>
    </div>

    <div class="order-items-list" id="cart-list">
      <div class="order-empty">
        <div class="order-empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></div>
        <div>Henüz ürün eklenmedi</div>
      </div>
    </div>

    <div class="order-footer">
      <div class="order-total-row">
        <span class="order-total-label">Toplam</span>
        <span class="order-total-amount" id="cart-total">₺0</span>
      </div>
      <button class="submit-btn" id="submit-btn" onclick="submitOrder()">Siparişi Gönder</button>
      <div id="mode-badge" class="mode-badge hidden"></div>
      <button class="clear-btn" onclick="clearCart()">Temizle</button>
    </div>
  </div>

</div>

<div class="sheet-backdrop" onclick="closeSheet()"></div>
<button class="cart-bar empty" id="cart-bar" onclick="openSheet()">
  <span class="cart-bar-count" id="cart-bar-count">0</span>
  <span class="cart-bar-text"><span id="cart-bar-label">Sepet boş</span> <span class="cart-bar-table" id="cart-bar-table"></span></span>
  <span class="cart-bar-total" id="cart-bar-total">₺0</span>
</button>

<div class="toast" id="toast"></div>

<script>
let menuItems    = [];
let cart         = {};   // { itemId: { name, price, quantity } }
let activeCategory = "Tümü";
let bungalovData  = [];
let activeOrderId = null;
let orderMode     = "new";

/* ── PIN ── */
let pinWaiter = "";
let pinValue  = "";

async function initPin() {
  const waiters = await fetch("/api/waiters").then(r => r.json());
  const grid = document.getElementById("waiter-btn-grid");
  grid.innerHTML = waiters.map(w => `
    <button class="waiter-btn" onclick="selectWaiter('${esc(w.name)}')">${esc(w.name)}</button>
  `).join("");
}

function selectWaiter(name) {
  pinWaiter = name;
  pinValue  = "";
  document.getElementById("pin-greeting").textContent = `PIN girin — ${name}`;
  document.getElementById("pin-error").textContent = "";
  updatePinDots();
  document.getElementById("pin-step-select").style.display = "none";
  document.getElementById("pin-step-pad").style.display    = "flex";
}

function pinKey(k) {
  if (pinValue.length >= 4) return;
  pinValue += k;
  updatePinDots();
  if (pinValue.length === 4) verifyPin();
}

function pinDel() {
  pinValue = pinValue.slice(0, -1);
  updatePinDots();
}

function pinBack() {
  pinValue = "";
  document.getElementById("pin-step-pad").style.display    = "none";
  document.getElementById("pin-step-select").style.display = "flex";
}

function updatePinDots() {
  for (let i = 0; i < 4; i++) {
    document.getElementById(`d${i}`).classList.toggle("filled", i < pinValue.length);
  }
}

async function verifyPin() {
  const res  = await fetch("/api/auth/pin", {
    method:  "POST",
    headers: { "Content-Type": "application/json" },
    body:    JSON.stringify({ name: pinWaiter, pin: pinValue }),
  });
  if (res.ok) {
    document.getElementById("pin-screen").classList.add("hidden");
    document.getElementById("garson-select").value = pinWaiter;
    localStorage.setItem("garson", pinWaiter);
  } else {
    document.getElementById("pin-error").textContent = "Hatalı PIN, tekrar deneyin";
    pinValue = "";
    updatePinDots();
    setTimeout(() => { document.getElementById("pin-error").textContent = ""; }, 2000);
  }
}

async function checkActiveOrder() {
  const table = document.getElementById("table-select").value;
  activeOrderId = null;
  orderMode = "new";
  const banner = document.getElementById("active-order-banner");

  if (!table) { banner.classList.add("hidden"); updateSubmitBtn(); return; }

  const order = await fetch(`/api/orders/active-by-table?table=${encodeURIComponent(table)}`).then(r => r.json());
  if (order) {
    activeOrderId = order.id;
    const itemCount = order.items.reduce((s, i) => s + i.quantity, 0);
    document.getElementById("active-order-label").textContent =
      `Bu masada açık sipariş var (${itemCount} ürün, ₺${order.total.toLocaleString("tr-TR")})`;
    banner.classList.remove("hidden");
    setModeAdd();
  } else {
    banner.classList.add("hidden");
    setModeNew();
  }
}

function setModeAdd() {
  orderMode = "add";
  document.querySelectorAll(".aob-btn").forEach(b => b.classList.remove("selected"));
  document.querySelector(".aob-add").classList.add("selected");
  updateSubmitBtn();
}

function openAdisyon() {
  if (activeOrderId) window.open(`/adisyon/${activeOrderId}`, "_blank");
}

function setModeNew() {
  orderMode = "new";
  document.querySelectorAll(".aob-btn").forEach(b => b.classList.remove("selected"));
  document.querySelector(".aob-new") && document.querySelector(".aob-new").classList.add("selected");
  updateSubmitBtn();
}

function updateSubmitBtn() {
  const btn   = document.getElementById("submit-btn");
  const badge = document.getElementById("mode-badge");
  if (orderMode === "add" && activeOrderId) {
    btn.textContent = "Mevcut Siparişe Ekle";
    btn.style.background = "var(--gold-dark)";
    badge.textContent = "Ekleme modu";
    badge.classList.remove("hidden");
  } else {
    btn.textContent = "Siparişi Gönder";
    btn.style.background = "";
    badge.classList.add("hidden");
  }
}

async function init() {
  await initPin();
  menuItems    = await fetch("/api/menu").then(r => r.json());
  bungalovData = await fetch("/api/bungalov").then(r => r.json());
  renderCategories();
  renderItems();
  renderBungalovSelect();
  updateCartBar();

  // Garson seçimini localStorage'dan geri yükle
  const saved = localStorage.getItem("garson");
  if (saved) document.getElementById("garson-select").value = saved;
  document.getElementById("garson-select").addEventListener("change", e => {
    localStorage.setItem("garson", e.target.value);
  });
}

function renderCategories() {
  const cats   = ["Tümü", ...new Set(menuItems.map(i => i.category).filter(Boolean))];
  const tabs   = document.getElementById("category-tabs");
  tabs.innerHTML = cats.map(c => `
    <button class="cat-btn ${c === activeCategory ? "active" : ""}" onclick="setCategory('${esc(c)}')">${esc(c)}</button>
  `).join("");
}

function setCategory(cat) {
  activeCategory = cat;
  renderCategories();
  renderItems();
}

function filterItems() {
  activeCategory = "Tümü";
  renderCategories();
  renderItems();
}

function renderItems() {
  const q        = document.getElementById("search-input").value.toLowerCase();
  const filtered = menuItems.filter(i => {
    const matchCat  = activeCategory === "Tümü" || i.category === activeCategory;
    const matchText = !q || i.name.toLowerCase().includes(q) || (i.category||"").toLowerCase().includes(q);
    return matchCat && matchText;
  });

  const container = document.getElementById("menu-items");
  if (!filtered.length) {
    container.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--ink-3)">Ürün bulunamadı</div>`;
    return;
  }

  container.innerHTML = filtered.map(item => {
    const qty     = cart[item.id]?.quantity || 0;
    const inCart  = qty > 0;
    return `
      <div class="menu-item-card ${inCart ? "in-cart" : ""}" onclick="addToCart(${item.id}, '${esc(item.name)}', ${item.price})">
        <div class="menu-item-cat">${esc(item.category || "")}</div>
        <div class="menu-item-name">${esc(item.name)}</div>
        <div class="menu-item-price">₺${item.price.toFixed(2)}</div>
        ${inCart ? `<div class="menu-item-qty-badge">${qty}</div>` : ""}
      </div>`;
  }).join("");
}

function addToCart(id, name, price) {
  if (cart[id]) cart[id].quantity++;
  else cart[id] = { name, price, quantity: 1 };
  renderCart();
  renderItems();
}

function changeQty(id, delta) {
  if (!cart[id]) return;
  cart[id].quantity += delta;
  if (cart[id].quantity <= 0) delete cart[id];
  renderCart();
  renderItems();
}

function renderCart() {
  const entries   = Object.entries(cart);
  const container = document.getElementById("cart-list");

  if (!entries.length) {
    container.innerHTML = `<div class="order-empty"><div class="order-empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></div><div>Henüz ürün eklenmedi</div></div>`;
    document.getElementById("cart-total").textContent = "₺0";
    updateCartBar();
    return;
  }

  container.innerHTML = entries.map(([id, item]) => `
    <div class="cart-item">
      <div class="cart-item-name">${esc(item.name)}</div>
      <div class="qty-controls">
        <button class="qty-btn" onclick="changeQty(${id}, -1)">−</button>
        <span class="qty-num">${item.quantity}</span>
        <button class="qty-btn" onclick="changeQty(${id}, 1)">+</button>
      </div>
      <div class="cart-item-subtotal">₺${(item.price * item.quantity).toLocaleString("tr-TR")}</div>
    </div>
  `).join("");

  const total = entries.reduce((s, [, i]) => s + i.price * i.quantity, 0);
  document.getElementById("cart-total").textContent = "₺" + total.toLocaleString("tr-TR");
  updateCartBar();
}

/* ── TELEFON: alttaki sepet çubuğu ve açılır sipariş sayfası ── */
function updateCartBar() {
  const entries = Object.values(cart);
  const count   = entries.reduce((s, i) => s + i.quantity, 0);
  const total   = entries.reduce((s, i) => s + i.price * i.quantity, 0);
  const table   = document.getElementById("table-select").value;
  document.getElementById("cart-bar").classList.toggle("empty", !count);
  document.getElementById("cart-bar-count").textContent = count;
  document.getElementById("cart-bar-label").textContent = count ? "Sepeti gör" : "Sepet boş";
  document.getElementById("cart-bar-table").textContent = table ? "· " + table : "· masa seçilmedi";
  document.getElementById("cart-bar-total").textContent = "₺" + total.toLocaleString("tr-TR");
}

function openSheet()  { document.body.classList.add("sheet-open"); }
function closeSheet() { document.body.classList.remove("sheet-open"); }

function clearCart() {
  cart = {};
  renderCart();
  renderItems();
}

function renderBungalovSelect() {
  const open = bungalovData.filter(b => b.account);
  const sel  = document.getElementById("bungalov-select");
  const row  = document.getElementById("bungalov-row");

  const NAMES = { 1: "Bungalov 1", 2: "Bungalov 2", 3: "Dağ Evi", 4: "Kütük Ev" };

  row.style.display = open.length ? "block" : "none";
  sel.innerHTML = `<option value="">Bungalov hesabına ekleme</option>` +
    open.map(b => `<option value="${b.no}">${NAMES[b.no]} — ${b.account.guest_name}</option>`).join("");
}

async function submitOrder() {
  const table   = document.getElementById("table-select").value;
  const waiter  = document.getElementById("garson-select").value;
  const notes   = document.getElementById("notes-input").value.trim();
  const bungalov_no = document.getElementById("bungalov-select").value || null;
  const entries = Object.entries(cart);

  if (!table)          return showToast("Lütfen masa seçin", "error");
  if (!waiter)         return showToast("Lütfen garson seçin", "error");
  if (!entries.length) return showToast("Lütfen ürün ekleyin", "error");

  const btn = document.getElementById("submit-btn");
  btn.disabled = true;
  btn.textContent = "Gönderiliyor...";

  const items = entries.map(([id, item]) => ({
    menu_item_id: parseInt(id),
    name: item.name,
    price: item.price,
    quantity: item.quantity,
  }));

  try {
    let res;
    if (orderMode === "add" && activeOrderId) {
      res = await fetch(`/api/orders/${activeOrderId}/items`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ items, notes }),
      });
      if (res.ok) {
        showToast(`✓ Siparişe eklendi — ${table}`);
        clearCart();
        closeSheet();
        document.getElementById("notes-input").value = "";
        await checkActiveOrder();
      } else {
        showToast("Hata oluştu, tekrar deneyin", "error");
      }
    } else {
      res = await fetch("/api/orders", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ table_number: table, notes, waiter, bungalov_no, items }),
      });
      if (res.ok) {
        showToast(`✓ Sipariş gönderildi — ${table}`);
        clearCart();
        closeSheet();
        document.getElementById("notes-input").value = "";
        await checkActiveOrder();
      } else {
        showToast("Hata oluştu, tekrar deneyin", "error");
      }
    }
  } catch {
    showToast("Bağlantı hatası", "error");
  }

  btn.disabled = false;
  updateSubmitBtn();
}

function showToast(msg, type = "") {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast" + (type ? " " + type : "");
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2800);
}

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

init();
</script>
</body>
</html>
