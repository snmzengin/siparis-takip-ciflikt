<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Sipariş Al — Çiftlik Restoran</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --teal:       #0d8a80;
      --teal-dark:  #0f4f4a;
      --teal-pale:  #d0f4f2;
      --teal-bg:    #f0f5f4;
      --green:      #10b981;
      --red:        #f43f5e;
      --border:     #dceeed;
      --text:       #1a3a38;
      --text-2:     #6b8e8b;
      --card:       #ffffff;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--teal-bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      background: linear-gradient(135deg, #0f4f4a, #1a7a72);
      color: #fff;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 10px rgba(15,79,74,0.25);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-title { font-size: 1.1rem; font-weight: 700; color: #e0f7f5; }
    .header-sub   { font-size: 0.65rem; color: rgba(255,255,255,0.55); letter-spacing: 3px; text-transform: uppercase; display: block; }

    .garson-select-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .garson-label { font-size: 0.75rem; color: rgba(255,255,255,0.6); }

    #garson-select {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    #garson-select option { background: #0f4f4a; color: #fff; }

    /* ── MAIN LAYOUT ── */
    .layout {
      display: flex;
      flex: 1;
      height: calc(100vh - 60px);
    }

    /* ── MENÜ PANELİ ── */
    .menu-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      overflow: hidden;
    }

    .search-bar {
      padding: 12px 16px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }

    .search-bar input {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      background: var(--teal-bg);
      color: var(--text);
    }
    .search-bar input:focus { outline: none; border-color: var(--teal); }

    .category-tabs {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      overflow-x: auto;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      scrollbar-width: none;
    }
    .category-tabs::-webkit-scrollbar { display: none; }

    .cat-btn {
      padding: 6px 16px;
      border-radius: 16px;
      border: 1.5px solid var(--border);
      background: var(--card);
      color: var(--text-2);
      font-size: 0.85rem;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .cat-btn.active, .cat-btn:hover { background: var(--teal); color: #fff; border-color: var(--teal); }

    .menu-items {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
      align-content: start;
    }

    .menu-item-card {
      background: var(--card);
      border-radius: 12px;
      padding: 14px 12px;
      text-align: center;
      cursor: pointer;
      border: 1.5px solid var(--border);
      transition: all 0.15s;
      box-shadow: 0 1px 3px rgba(13,59,55,0.06);
      user-select: none;
    }
    .menu-item-card:hover  { border-color: var(--teal); box-shadow: 0 2px 10px rgba(13,138,128,0.15); }
    .menu-item-card:active { transform: scale(0.96); }
    .menu-item-card.in-cart { border-color: var(--teal); background: #f0faf9; }

    .menu-item-name  { font-size: 0.88rem; font-weight: 600; color: var(--text); line-height: 1.3; margin-bottom: 6px; }
    .menu-item-price { font-size: 0.95rem; font-weight: 800; color: var(--teal); }
    .menu-item-cat   { font-size: 0.7rem; color: var(--text-2); margin-bottom: 4px; }

    .menu-item-qty-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--teal);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      width: 22px; height: 22px;
      border-radius: 50%;
      margin-top: 6px;
    }

    /* ── SİPARİŞ PANELİ ── */
    .order-panel {
      width: 320px;
      display: flex;
      flex-direction: column;
      background: var(--card);
      flex-shrink: 0;
    }

    .order-panel-header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
      background: #f8fdfc;
    }

    .order-meta {
      display: flex;
      gap: 10px;
      margin-bottom: 8px;
    }

    .order-meta select,
    .order-meta input {
      flex: 1;
      padding: 9px 12px;
      border: 1.5px solid var(--border);
      border-radius: 9px;
      font-size: 0.9rem;
      font-weight: 600;
      background: var(--card);
      color: var(--text);
    }
    .order-meta select:focus,
    .order-meta input:focus { outline: none; border-color: var(--teal); }

    .order-notes-input {
      width: 100%;
      padding: 8px 12px;
      border: 1.5px solid var(--border);
      border-radius: 9px;
      font-size: 0.85rem;
      background: var(--card);
      color: var(--text);
    }
    .order-notes-input:focus { outline: none; border-color: var(--teal); }

    .order-items-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
    }

    .cart-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 0;
      border-bottom: 1px solid #f0faf9;
    }
    .cart-item:last-child { border-bottom: none; }

    .cart-item-name { flex: 1; font-size: 0.87rem; font-weight: 500; color: var(--text); }
    .cart-item-subtotal { font-size: 0.85rem; font-weight: 700; color: var(--teal); min-width: 60px; text-align: right; }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .qty-btn {
      width: 30px; height: 30px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: var(--teal-bg);
      color: var(--teal);
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.12s;
      flex-shrink: 0;
    }
    .qty-btn:hover  { background: var(--teal); color: #fff; border-color: var(--teal); }
    .qty-btn:active { transform: scale(0.92); }
    .qty-num { width: 24px; text-align: center; font-size: 0.9rem; font-weight: 700; }

    .order-empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-2);
      font-size: 0.9rem;
    }
    .order-empty-icon { font-size: 2.5rem; margin-bottom: 10px; opacity: 0.4; }

    .order-footer {
      padding: 14px 16px;
      border-top: 2px solid var(--teal-pale);
      background: #f8fdfc;
    }

    .order-total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .order-total-label { font-size: 0.85rem; color: var(--text-2); font-weight: 500; }
    .order-total-amount { font-size: 1.4rem; font-weight: 800; color: var(--teal-dark); }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: var(--teal);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 0 4px 12px rgba(13,138,128,0.3);
    }
    .submit-btn:hover  { background: #0a7068; }
    .submit-btn:active { transform: scale(0.98); }
    .submit-btn:disabled { background: #b2dedd; box-shadow: none; cursor: not-allowed; }

    .clear-btn {
      width: 100%;
      padding: 10px;
      background: transparent;
      color: var(--red);
      border: 1.5px solid #fca5a5;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.15s;
    }
    .clear-btn:hover { background: #fff0f2; }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--teal-dark);
      color: #fff;
      padding: 12px 28px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(13,59,55,0.3);
      transition: transform 0.3s ease;
      z-index: 999;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.error { background: #c62828; }

    /* ── AKTİF SİPARİŞ BANNER ── */
    .active-order-banner {
      background: #fffbeb;
      border: 1.5px solid #fbbf24;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    .active-order-info { font-size: 0.8rem; color: #92400e; font-weight: 600; margin-bottom: 8px; }
    .active-order-actions { display: flex; gap: 8px; }
    .aob-btn {
      flex: 1; padding: 7px 6px; border-radius: 8px; border: 1.5px solid #e5e7eb;
      font-size: 0.78rem; font-weight: 600; cursor: pointer; background: #fff;
      color: #374151; transition: all 0.15s;
    }
    .aob-btn.selected { border-color: var(--teal); background: var(--teal); color: #fff; }
    .aob-add.selected { background: #0369a1; border-color: #0369a1; }
    .aob-receipt { background: #f5f3ff; border-color: #ddd6fe; color: #6d28d9; }
    .aob-receipt:hover { background: #6d28d9; border-color: #6d28d9; color: #fff; }
    .mode-badge {
      text-align: center; font-size: 0.75rem; color: #0369a1;
      font-weight: 600; margin-top: 6px;
    }

    /* ── BUNGALOV ROW ── */
    .bungalov-row {
      display: none;
      margin-top: 8px;
    }
    .bungalov-row select {
      width: 100%;
      padding: 8px 12px;
      border: 1.5px solid var(--border);
      border-radius: 9px;
      font-size: 0.85rem;
      background: var(--card);
      color: var(--text);
    }
    .bungalov-row select:focus { outline: none; border-color: var(--teal); }

    @media (max-width: 600px) {
      .order-panel { width: 260px; }
      .menu-items  { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
    }

    /* ── PIN EKRANI ── */
    #pin-screen {
      position: fixed; inset: 0; z-index: 1000;
      background: linear-gradient(145deg, #0d3b37, #0d8a80);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 28px;
    }
    #pin-screen.hidden { display: none; }

    .pin-logo { font-size: 0.75rem; color: rgba(255,255,255,0.5); letter-spacing: 3px; text-transform: uppercase; }
    .pin-title { font-size: 1.6rem; font-weight: 800; color: #fff; }

    .waiter-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 12px; width: 280px;
    }
    .waiter-btn {
      padding: 16px; border-radius: 14px; border: 2px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.1); color: #fff;
      font-size: 1rem; font-weight: 700; cursor: pointer;
      transition: all 0.15s;
    }
    .waiter-btn:hover { background: rgba(255,255,255,0.22); border-color: rgba(255,255,255,0.45); }
    .waiter-btn.selected { background: #fff; color: #0d3b37; border-color: #fff; }

    .pin-pad-wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .pin-dots { display: flex; gap: 14px; margin-bottom: 4px; }
    .pin-dot {
      width: 16px; height: 16px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.5); background: transparent;
      transition: background 0.15s;
    }
    .pin-dot.filled { background: #fff; border-color: #fff; }

    .pin-grid {
      display: grid; grid-template-columns: repeat(3, 80px);
      gap: 10px;
    }
    .pin-key {
      height: 72px; border-radius: 14px;
      border: 2px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.1); color: #fff;
      font-size: 1.4rem; font-weight: 700; cursor: pointer;
      transition: all 0.12s; display: flex; align-items: center; justify-content: center;
    }
    .pin-key:hover  { background: rgba(255,255,255,0.22); }
    .pin-key:active { transform: scale(0.93); }
    .pin-key.del    { font-size: 1rem; color: rgba(255,255,255,0.7); }
    .pin-key.empty  { border: none; background: transparent; cursor: default; pointer-events: none; }

    .pin-error { color: #fca5a5; font-size: 0.85rem; font-weight: 600; height: 20px; }
    .pin-back  { color: rgba(255,255,255,0.5); font-size: 0.82rem; cursor: pointer; text-decoration: underline; margin-top: 4px; }
  </style>
</head>
<body>

<!-- PIN Ekranı -->
<div id="pin-screen">
  <div class="pin-logo">Sapanca Çiftlik Restoran</div>

  <!-- Adım 1: Garson seçimi -->
  <div id="pin-step-select" style="display:flex;flex-direction:column;align-items:center;gap:20px">
    <div class="pin-title">Merhaba, kim giriş yapıyor?</div>
    <div class="waiter-grid" id="waiter-btn-grid"></div>
  </div>

  <!-- Adım 2: PIN girişi -->
  <div id="pin-step-pad" style="display:none;flex-direction:column;align-items:center;gap:20px">
    <div class="pin-title" id="pin-greeting"></div>
    <div class="pin-pad-wrap">
      <div class="pin-dots">
        <div class="pin-dot" id="d0"></div>
        <div class="pin-dot" id="d1"></div>
        <div class="pin-dot" id="d2"></div>
        <div class="pin-dot" id="d3"></div>
      </div>
      <div class="pin-error" id="pin-error"></div>
      <div class="pin-grid">
        <button class="pin-key" onclick="pinKey('1')">1</button>
        <button class="pin-key" onclick="pinKey('2')">2</button>
        <button class="pin-key" onclick="pinKey('3')">3</button>
        <button class="pin-key" onclick="pinKey('4')">4</button>
        <button class="pin-key" onclick="pinKey('5')">5</button>
        <button class="pin-key" onclick="pinKey('6')">6</button>
        <button class="pin-key" onclick="pinKey('7')">7</button>
        <button class="pin-key" onclick="pinKey('8')">8</button>
        <button class="pin-key" onclick="pinKey('9')">9</button>
        <button class="pin-key empty"></button>
        <button class="pin-key" onclick="pinKey('0')">0</button>
        <button class="pin-key del" onclick="pinDel()">⌫</button>
      </div>
    </div>
    <span class="pin-back" onclick="pinBack()">← Geri dön</span>
  </div>
</div>

<header>
  <div>
    <span class="header-sub">Sapanca Çiftlik</span>
    <div class="header-title">Sipariş Al</div>
  </div>
  <div class="garson-select-wrap">
    <span class="garson-label">Garson:</span>
    <select id="garson-select">
      <option value="">Seç</option>
      <option>Sami</option>
      <option>Rahman</option>
      <option>Engin</option>
      <option>Bedirhan</option>
    </select>
  </div>
</header>

<div class="layout">

  <!-- Menü Paneli -->
  <div class="menu-panel">
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Ürün ara..." oninput="filterItems()" />
    </div>
    <div class="category-tabs" id="category-tabs"></div>
    <div class="menu-items" id="menu-items"></div>
  </div>

  <!-- Sipariş Paneli -->
  <div class="order-panel">
    <div class="order-panel-header">
      <div id="active-order-banner" class="active-order-banner hidden">
        <div class="active-order-info">
          <span id="active-order-label">Bu masada açık sipariş var</span>
        </div>
        <div class="active-order-actions">
          <button class="aob-btn aob-add" onclick="setModeAdd()">+ Ekle</button>
          <button class="aob-btn aob-new" onclick="setModeNew()">Yeni</button>
          <button class="aob-btn aob-receipt" onclick="openAdisyon()">📄 Adisyon</button>
        </div>
      </div>

      <div class="order-meta">
        <select id="table-select" onchange="checkActiveOrder()">
          <option value="">Masa Seç</option>
          <optgroup label="Sağ">
            <option>sağ 1</option><option>sağ 2</option><option>sağ 3</option>
            <option>sağ 4</option><option>sağ 5</option><option>sağ 6</option><option>sağ 7</option>
          </optgroup>
          <optgroup label="Orta">
            <option>orta 1</option><option>orta 2</option><option>orta 3</option>
            <option>orta 4</option><option>orta 5</option><option>orta 6</option>
          </optgroup>
          <optgroup label="Sol">
            <option>sol 1</option><option>sol 2</option><option>sol 3</option>
            <option>sol 4</option><option>sol 5</option><option>sol 6</option>
          </optgroup>
        </select>
      </div>
      <input type="text" class="order-notes-input" id="notes-input" placeholder="Not (opsiyonel)..." />
      <div class="bungalov-row" id="bungalov-row">
        <select id="bungalov-select">
          <option value="">Bungalov hesabına ekleme</option>
        </select>
      </div>
    </div>

    <div class="order-items-list" id="cart-list">
      <div class="order-empty">
        <div class="order-empty-icon">🛒</div>
        <div>Henüz ürün eklenmedi</div>
      </div>
    </div>

    <div class="order-footer">
      <div class="order-total-row">
        <span class="order-total-label">Toplam</span>
        <span class="order-total-amount" id="cart-total">₺0</span>
      </div>
      <button class="submit-btn" id="submit-btn" onclick="submitOrder()">Siparişi Gönder</button>
      <div id="mode-badge" class="mode-badge hidden"></div>
      <button class="clear-btn" onclick="clearCart()">Temizle</button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
let menuItems    = [];
let cart         = {};   // { itemId: { name, price, quantity } }
let activeCategory = "Tümü";
let bungalovData  = [];
let activeOrderId = null;
let orderMode     = "new";

/* ── PIN ── */
let pinWaiter = "";
let pinValue  = "";

async function initPin() {
  const waiters = await fetch("/api/waiters").then(r => r.json());
  const grid = document.getElementById("waiter-btn-grid");
  grid.innerHTML = waiters.map(w => `
    <button class="waiter-btn" onclick="selectWaiter('${esc(w.name)}')">${esc(w.name)}</button>
  `).join("");
}

function selectWaiter(name) {
  pinWaiter = name;
  pinValue  = "";
  document.getElementById("pin-greeting").textContent = `PIN girin — ${name}`;
  document.getElementById("pin-error").textContent = "";
  updatePinDots();
  document.getElementById("pin-step-select").style.display = "none";
  document.getElementById("pin-step-pad").style.display    = "flex";
}

function pinKey(k) {
  if (pinValue.length >= 4) return;
  pinValue += k;
  updatePinDots();
  if (pinValue.length === 4) verifyPin();
}

function pinDel() {
  pinValue = pinValue.slice(0, -1);
  updatePinDots();
}

function pinBack() {
  pinValue = "";
  document.getElementById("pin-step-pad").style.display    = "none";
  document.getElementById("pin-step-select").style.display = "flex";
}

function updatePinDots() {
  for (let i = 0; i < 4; i++) {
    document.getElementById(`d${i}`).classList.toggle("filled", i < pinValue.length);
  }
}

async function verifyPin() {
  const res  = await fetch("/api/auth/pin", {
    method:  "POST",
    headers: { "Content-Type": "application/json" },
    body:    JSON.stringify({ name: pinWaiter, pin: pinValue }),
  });
  if (res.ok) {
    document.getElementById("pin-screen").classList.add("hidden");
    document.getElementById("garson-select").value = pinWaiter;
    localStorage.setItem("garson", pinWaiter);
  } else {
    document.getElementById("pin-error").textContent = "Hatalı PIN, tekrar deneyin";
    pinValue = "";
    updatePinDots();
    setTimeout(() => { document.getElementById("pin-error").textContent = ""; }, 2000);
  }
}

async function checkActiveOrder() {
  const table = document.getElementById("table-select").value;
  activeOrderId = null;
  orderMode = "new";
  const banner = document.getElementById("active-order-banner");

  if (!table) { banner.classList.add("hidden"); updateSubmitBtn(); return; }

  const order = await fetch(`/api/orders/active-by-table?table=${encodeURIComponent(table)}`).then(r => r.json());
  if (order) {
    activeOrderId = order.id;
    const itemCount = order.items.reduce((s, i) => s + i.quantity, 0);
    document.getElementById("active-order-label").textContent =
      `Bu masada açık sipariş var (${itemCount} ürün, ₺${order.total.toLocaleString("tr-TR")})`;
    banner.classList.remove("hidden");
    setModeAdd();
  } else {
    banner.classList.add("hidden");
    setModeNew();
  }
}

function setModeAdd() {
  orderMode = "add";
  document.querySelectorAll(".aob-btn").forEach(b => b.classList.remove("selected"));
  document.querySelector(".aob-add").classList.add("selected");
  updateSubmitBtn();
}

function openAdisyon() {
  if (activeOrderId) window.open(`/adisyon/${activeOrderId}`, "_blank");
}

function setModeNew() {
  orderMode = "new";
  document.querySelectorAll(".aob-btn").forEach(b => b.classList.remove("selected"));
  document.querySelector(".aob-new") && document.querySelector(".aob-new").classList.add("selected");
  updateSubmitBtn();
}

function updateSubmitBtn() {
  const btn   = document.getElementById("submit-btn");
  const badge = document.getElementById("mode-badge");
  if (orderMode === "add" && activeOrderId) {
    btn.textContent = "Mevcut Siparişe Ekle";
    btn.style.background = "#0369a1";
    badge.textContent = "Ekleme modu";
    badge.classList.remove("hidden");
  } else {
    btn.textContent = "Siparişi Gönder";
    btn.style.background = "";
    badge.classList.add("hidden");
  }
}

async function init() {
  await initPin();
  menuItems    = await fetch("/api/menu").then(r => r.json());
  bungalovData = await fetch("/api/bungalov").then(r => r.json());
  renderCategories();
  renderItems();
  renderBungalovSelect();

  // Garson seçimini localStorage'dan geri yükle
  const saved = localStorage.getItem("garson");
  if (saved) document.getElementById("garson-select").value = saved;
  document.getElementById("garson-select").addEventListener("change", e => {
    localStorage.setItem("garson", e.target.value);
  });
}

function renderCategories() {
  const cats   = ["Tümü", ...new Set(menuItems.map(i => i.category).filter(Boolean))];
  const tabs   = document.getElementById("category-tabs");
  tabs.innerHTML = cats.map(c => `
    <button class="cat-btn ${c === activeCategory ? "active" : ""}" onclick="setCategory('${esc(c)}')">${esc(c)}</button>
  `).join("");
}

function setCategory(cat) {
  activeCategory = cat;
  renderCategories();
  renderItems();
}

function filterItems() {
  activeCategory = "Tümü";
  renderCategories();
  renderItems();
}

function renderItems() {
  const q        = document.getElementById("search-input").value.toLowerCase();
  const filtered = menuItems.filter(i => {
    const matchCat  = activeCategory === "Tümü" || i.category === activeCategory;
    const matchText = !q || i.name.toLowerCase().includes(q) || (i.category||"").toLowerCase().includes(q);
    return matchCat && matchText;
  });

  const container = document.getElementById("menu-items");
  if (!filtered.length) {
    container.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px;color:#6b8e8b">Ürün bulunamadı</div>`;
    return;
  }

  container.innerHTML = filtered.map(item => {
    const qty     = cart[item.id]?.quantity || 0;
    const inCart  = qty > 0;
    return `
      <div class="menu-item-card ${inCart ? "in-cart" : ""}" onclick="addToCart(${item.id}, '${esc(item.name)}', ${item.price})">
        <div class="menu-item-cat">${esc(item.category || "")}</div>
        <div class="menu-item-name">${esc(item.name)}</div>
        <div class="menu-item-price">₺${item.price.toFixed(2)}</div>
        ${inCart ? `<div class="menu-item-qty-badge">${qty}</div>` : ""}
      </div>`;
  }).join("");
}

function addToCart(id, name, price) {
  if (cart[id]) cart[id].quantity++;
  else cart[id] = { name, price, quantity: 1 };
  renderCart();
  renderItems();
}

function changeQty(id, delta) {
  if (!cart[id]) return;
  cart[id].quantity += delta;
  if (cart[id].quantity <= 0) delete cart[id];
  renderCart();
  renderItems();
}

function renderCart() {
  const entries   = Object.entries(cart);
  const container = document.getElementById("cart-list");

  if (!entries.length) {
    container.innerHTML = `<div class="order-empty"><div class="order-empty-icon">🛒</div><div>Henüz ürün eklenmedi</div></div>`;
    document.getElementById("cart-total").textContent = "₺0";
    return;
  }

  container.innerHTML = entries.map(([id, item]) => `
    <div class="cart-item">
      <div class="cart-item-name">${esc(item.name)}</div>
      <div class="qty-controls">
        <button class="qty-btn" onclick="changeQty(${id}, -1)">−</button>
        <span class="qty-num">${item.quantity}</span>
        <button class="qty-btn" onclick="changeQty(${id}, 1)">+</button>
      </div>
      <div class="cart-item-subtotal">₺${(item.price * item.quantity).toLocaleString("tr-TR")}</div>
    </div>
  `).join("");

  const total = entries.reduce((s, [, i]) => s + i.price * i.quantity, 0);
  document.getElementById("cart-total").textContent = "₺" + total.toLocaleString("tr-TR");
}

function clearCart() {
  cart = {};
  renderCart();
  renderItems();
}

function renderBungalovSelect() {
  const open = bungalovData.filter(b => b.account);
  const sel  = document.getElementById("bungalov-select");
  const row  = document.getElementById("bungalov-row");

  const NAMES = { 1: "Bungalov 1", 2: "Bungalov 2", 3: "Dağ Evi", 4: "Kütük Ev" };

  row.style.display = open.length ? "block" : "none";
  sel.innerHTML = `<option value="">Bungalov hesabına ekleme</option>` +
    open.map(b => `<option value="${b.no}">${NAMES[b.no]} — ${b.account.guest_name}</option>`).join("");
}

async function submitOrder() {
  const table   = document.getElementById("table-select").value;
  const waiter  = document.getElementById("garson-select").value;
  const notes   = document.getElementById("notes-input").value.trim();
  const bungalov_no = document.getElementById("bungalov-select").value || null;
  const entries = Object.entries(cart);

  if (!table)          return showToast("Lütfen masa seçin", "error");
  if (!waiter)         return showToast("Lütfen garson seçin", "error");
  if (!entries.length) return showToast("Lütfen ürün ekleyin", "error");

  const btn = document.getElementById("submit-btn");
  btn.disabled = true;
  btn.textContent = "Gönderiliyor...";

  const items = entries.map(([id, item]) => ({
    menu_item_id: parseInt(id),
    name: item.name,
    price: item.price,
    quantity: item.quantity,
  }));

  try {
    let res;
    if (orderMode === "add" && activeOrderId) {
      res = await fetch(`/api/orders/${activeOrderId}/items`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ items, notes }),
      });
      if (res.ok) {
        showToast(`✓ Siparişe eklendi — ${table}`);
        clearCart();
        document.getElementById("notes-input").value = "";
        await checkActiveOrder();
      } else {
        showToast("Hata oluştu, tekrar deneyin", "error");
      }
    } else {
      res = await fetch("/api/orders", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ table_number: table, notes, waiter, bungalov_no, items }),
      });
      if (res.ok) {
        showToast(`✓ Sipariş gönderildi — ${table}`);
        clearCart();
        document.getElementById("notes-input").value = "";
        await checkActiveOrder();
      } else {
        showToast("Hata oluştu, tekrar deneyin", "error");
      }
    }
  } catch {
    showToast("Bağlantı hatası", "error");
  }

  btn.disabled = false;
  updateSubmitBtn();
}

function showToast(msg, type = "") {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast" + (type ? " " + type : "");
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2800);
}

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

init();
</script>
</body>
</html>
