<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F8F3E6" />
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png" />
  <meta name="apple-mobile-web-app-title" content="Çiftlik" />
  <title>Giriş — Sapanca Çiftlik Restoran</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --cream: #F8F3E6; --paper: #FCFAF1; --ink: #2B2A24; --muted: #6E6A5C; --accent: #2F6B3F; --accent-hov: #265834; --danger: #A63D2F; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
      background: var(--cream); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    }
    .card {
      width: 100%; max-width: 360px; background: var(--paper); border-radius: 20px; padding: 32px 24px;
      box-shadow: 0 10px 40px rgba(43, 42, 36, 0.10); text-align: center;
    }
    .avatar {
      width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 16px; background: var(--accent); color: #fff;
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 20px;
    }
    h1 { font-size: 20px; margin-bottom: 4px; }
    p { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
    input {
      width: 100%; font: inherit; font-size: 17px; padding: 14px 16px; border-radius: 12px;
      border: 1px solid rgba(43, 42, 36, 0.18); background: #fff; margin-bottom: 12px;
    }
    input:focus { outline: 2px solid var(--accent); border-color: transparent; }
    button {
      width: 100%; font: inherit; font-size: 17px; font-weight: 600; padding: 14px; border: 0; border-radius: 12px;
      background: var(--accent); color: #fff; cursor: pointer;
    }
    button:hover { background: var(--accent-hov); }
    .error { color: var(--danger); font-size: 14px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <form class="card" method="post" action="/giris">
    <div class="avatar">ÇR</div>
    <h1>Sapanca Çiftlik Restoran</h1>
    <p>Bu cihaz bir kez giriş yapınca 1 yıl hatırlanır.</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <input type="hidden" name="next" value="{{ next }}" />
    <input type="password" name="password" placeholder="Şifre" autocomplete="current-password" autofocus required />
    <button type="submit">Giriş</button>
  </form>
</body>
</html>
